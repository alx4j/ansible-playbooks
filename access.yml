---
- name: Verify existing development access before choosing the setup path
  hosts: development
  remote_user: "{{ dev_host_user }}"
  gather_facts: false
  become: true
  serial: 1
  tasks:
    - name: Verify the development account and sudo over a fresh connection
      ansible.builtin.import_role:
        name: dev_host
        tasks_from: access
