---
all:
  children:
    development:
      vars:
        sudo_user: "{{ lookup('ansible.builtin.env', 'DEPLOY_SUDO_USER', default=undef()) }}"
        # Supply approved public keys before running a playbook.
        dev_host_authorized_keys: []
      hosts:
        # Names of per-server secrets in the GitHub development environment.
        dev01:
          ansible_host: 192.0.2.10
          dev_host_bootstrap_user: root
          bootstrap_password_secret: BOOTSTRAP_DEV01_PASSWORD

        dev02:
          ansible_host: 192.0.2.11
          dev_host_bootstrap_user: ubuntu
          bootstrap_password_secret: BOOTSTRAP_DEV02_PASSWORD
