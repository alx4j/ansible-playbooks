---
# Copy this inventory to inventories/local and supply your own public keys.
dev_host_authorized_keys: []
# Bootstrap preserves existing passwords. For a new account, supply a password
# hash securely or explicitly choose passwordless sudo here.
dev_host_passwordless_sudo: false

# These values were observed on the source VPS; they are explicit policy.
dev_host_ssh_permit_root_login: "no"
dev_host_ssh_password_authentication: "no"
dev_host_ssh_keyboard_interactive_authentication: "no"

# Preserve existing application configuration unless a source is supplied.
# Use absolute controller-side paths inside the ignored private/ directory.
dev_host_codex_config_source: ""
dev_host_codex_instructions_source: ""
