name: Validate playbooks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation tools
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/ansible-galaxy collection install -r requirements.yml -p .ansible/collections
      - name: Run unit, lint, syntax, and inventory checks
        run: scripts/check
      - name: Test account convergence and SSH validation in a disposable container
        env:
          CONTAINER_ENGINE: docker
        run: scripts/test-container
