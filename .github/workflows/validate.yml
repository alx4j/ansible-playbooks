name: Validate playbooks
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install validation tools
        run: scripts/setup
      - name: Run unit, lint, syntax, and inventory checks
        run: scripts/check

  ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the test image with cached dependencies
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/Containerfile
          load: true
          tags: localhost/ansible-playbooks-test:local
          cache-from: type=gha,scope=ansible-tests
          cache-to: type=gha,mode=max,scope=ansible-tests

      - name: Test account convergence and SSH validation in a disposable container
        env:
          CONTAINER_ENGINE: docker
          CONTAINER_TEST_IMAGE: localhost/ansible-playbooks-test:local
        run: scripts/test-container

  tools:
    name: Full host and toolchain tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install validation tools
        run: scripts/setup
      - name: Cache checksum-verified tool installers
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/tool-installers
          key: ${{ runner.os }}-${{ runner.arch }}-tool-installers-${{ hashFiles('roles/dev_host/defaults/main.yml') }}
      - name: Bootstrap and verify the disposable hosted VM
        env:
          TOOL_INSTALLER_CACHE: ${{ runner.temp }}/tool-installers
        run: scripts/test-vm

  validate:
    if: ${{ always() }}
    needs: [checks, ssh, tools]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SSH_RESULT: ${{ needs.ssh.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$SSH_RESULT" = success
          test "$TOOLS_RESULT" = success
