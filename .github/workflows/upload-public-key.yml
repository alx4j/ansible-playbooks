name: Upload public SSH key

on:
  workflow_dispatch:
    inputs:
      username:
        description: Existing SSH username
        type: string
        required: true
      server_address:
        description: Server hostname, IP address, or inventory name
        type: string
        required: true
      user_public_key:
        description: Public SSH key to add to this account
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ansible-deployment
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned Ansible dependencies
        run: scripts/setup
      - name: Authorize the public key over SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANSIBLE_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.ANSIBLE_SSH_PORT }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python3 scripts/github-deploy.py --upload-public-key
