name: Maintain dev server
run-name: "Maintain dev server: ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      server_address:
        description: Server IP address or hostname
        type: string
        required: true
      mode:
        description: Preview package upgrades (check) or apply them (apply)
        type: choice
        required: true
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

# Share the lock with server setup to prevent overlapping changes.
concurrency:
  group: ansible-deployment
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned Ansible dependencies
        run: scripts/setup
      - name: Validate the checked-out playbooks
        run: scripts/check
      - name: Upgrade installed packages through development-user access
        env:
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANSIBLE_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.ANSIBLE_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python3 scripts/github-deploy.py --maintenance
