name: Bootstrap dev server
run-name: "Bootstrap dev server: ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      server_address:
        description: Server IP address or hostname
        type: string
        required: true
      bootstrap_user:
        description: Initial administrator account (first setup only)
        type: string
        required: false
        default: root
      bootstrap_password:
        description: Initial SSH and sudo password (first setup only; ordinary workflow input)
        type: string
        required: false
      mode:
        description: Preview changes (check) or make changes (apply)
        type: choice
        required: true
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

# Serialize deployments so two runs cannot change the server at once.
concurrency:
  group: ansible-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    steps:
      - name: Mask the bootstrap password before other steps
        # Read the event file so the value never appears in a step's env header.
        run: |
          python3 - <<'PY'
          import json
          import os
          with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
              password = json.load(event_file).get("inputs", {}).get("bootstrap_password", "")
          if not isinstance(password, str):
              raise SystemExit("Bootstrap password must be text.")
          if password:
              escaped = password.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + escaped)
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned Ansible dependencies
        run: scripts/setup
      - name: Validate the checked-out playbooks
        run: scripts/check
      - name: Bootstrap and configure the development server
        env:
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANSIBLE_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.ANSIBLE_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python3 scripts/github-deploy.py
