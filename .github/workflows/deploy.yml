name: Deploy Ansible manually
run-name: "${{ inputs.mode }} ${{ inputs.playbook }} on ${{ inputs.host }} (${{ inputs.environment }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the deployment configuration
        type: environment
        required: true
      playbook:
        description: Playbook to run
        type: choice
        required: true
        default: site
        options:
          - site
          - bootstrap
          - maintenance
      host:
        description: Exact inventory hostname (one host, not a pattern)
        type: string
        required: true
        default: dev01
      mode:
        description: Check predicts changes; apply modifies the selected host
        type: choice
        required: true
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

# Serialize all deployments, including different environments that share a VPS.
concurrency:
  group: ansible-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned Ansible dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/ansible-galaxy collection install -r requirements.yml -p .ansible/collections
      - name: Validate the checked-out playbooks
        run: scripts/check
      - name: Run the selected playbook
        env:
          DEPLOY_PLAYBOOK: ${{ inputs.playbook }}
          DEPLOY_HOST: ${{ inputs.host }}
          DEPLOY_MODE: ${{ inputs.mode }}
          DEPLOY_INVENTORY: ${{ vars.ANSIBLE_INVENTORY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANSIBLE_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
          DEV_PASSWORD_HASH: ${{ secrets.DEV_PASSWORD_HASH }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          scripts/deploy
