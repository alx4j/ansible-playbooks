name: Bootstrap VPS
run-name: Bootstrap VPS

on:
  workflow_run:
    workflows: [Validate playbooks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      server_address:
        description: Server hostname, IP address, or inventory name
        type: string
        required: true
      bootstrap_user:
        description: Bootstrap username
        type: string
        required: false
      bootstrap_password:
        description: Bootstrap password (SSH and sudo)
        type: string
        required: false

permissions:
  contents: read

# Serialize deployments so two runs cannot change the server at once.
concurrency:
  group: ansible-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha == github.sha &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    steps:
      - name: Mask the bootstrap password before other steps
        if: github.event_name == 'workflow_dispatch'
        # Read the event file so the value never appears in a step's env header.
        run: |
          python3 - <<'PY'
          import json
          import os
          with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
              password = json.load(event_file).get("inputs", {}).get("bootstrap_password", "")
          if not isinstance(password, str):
              raise SystemExit("Bootstrap password must be text.")
          if password:
              escaped = password.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + escaped)
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned Ansible dependencies
        run: scripts/setup
      - name: Validate the checked-out playbooks
        run: scripts/check
      - name: Configure inventory servers with existing access
        if: github.event_name == 'workflow_run'
        env:
          PROJECTS_DIR: ${{ vars.PROJECTS_DIR }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANSIBLE_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.ANSIBLE_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DEPLOY_SUDO_USER: ${{ vars.SUDO_USER }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python3 scripts/github-deploy.py --update-inventory
      - name: Bootstrap and configure the selected server
        if: github.event_name == 'workflow_dispatch'
        env:
          PROJECTS_DIR: ${{ vars.PROJECTS_DIR }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANSIBLE_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.ANSIBLE_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DEPLOY_SUDO_USER: ${{ vars.SUDO_USER }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python3 scripts/github-deploy.py
