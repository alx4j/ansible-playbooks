---
- name: Establish development access through the initial administrator
  hosts: development
  gather_facts: true
  serial: 1
  vars:
    ansible_user: "{{ dev_host_bootstrap_user | default('root') }}"
    ansible_become: "{{ (dev_host_bootstrap_user | default('root')) != 'root' }}"
  tasks:
    - name: Bootstrap the account and sudo access
      ansible.builtin.import_role:
        name: dev_host
        tasks_from: bootstrap
