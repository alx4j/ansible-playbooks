---
- name: Configure the development VPS through verified dev access
  hosts: development
  remote_user: "{{ dev_host_user }}"
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: dev_host
    - role: tokeneconomizer
      when: tokeneconomizer_enabled | bool
    - role: doppler_secrets
      when: doppler_secrets_enabled | bool
      doppler_secrets_install_skill: "{{ not (agent_toolkit_enabled | bool) }}"
    - role: github_access
      when: (agent_toolkit_enabled | bool) or (work_repositories_enabled | bool)
    - role: agent_toolkit
      when: agent_toolkit_enabled | bool
    - role: work_repositories
      when: work_repositories_enabled | bool
