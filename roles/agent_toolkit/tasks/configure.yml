---
- name: Reject unmanaged checkouts and preserve local toolkit work
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - /usr/local/lib/agent-toolkit/install.py
      - --check-checkout
      - --checkout
      - "{{ agent_toolkit_checkout }}"
      - --repository
      - "{{ agent_toolkit_repository }}"
  changed_when: false

- name: Update the managed toolkit checkout from main
  ansible.builtin.git:
    repo: "{{ agent_toolkit_repository }}"
    dest: "{{ agent_toolkit_checkout }}"
    version: main
    update: true
    force: false
    recursive: false
    ssh_opts: "{{ (agent_toolkit_access.stdout | from_json).ssh_options | map('quote') | join(' ') }}"
  environment:
    GIT_CONFIG_GLOBAL: /dev/null
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_TERMINAL_PROMPT: "0"

- name: Record ownership of the dedicated toolkit checkout
  ansible.builtin.copy:
    content: "{{ {'repository': agent_toolkit_repository} | to_json }}\n"
    dest: "{{ agent_toolkit_checkout }}/.git/ansible-agent-toolkit.json"
    mode: "0600"

- name: Install changed plugin packages and link global instructions
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - /usr/local/lib/agent-toolkit/install.py
      - --checkout
      - "{{ agent_toolkit_checkout }}"
      - --plugins
      - "{{ agent_toolkit_plugins | to_json }}"
      - --manage-instructions
      - "{{ agent_toolkit_manage_instructions | bool | ternary('yes', 'no') }}"
  register: agent_toolkit_result
  changed_when: agent_toolkit_result.rc == 0 and (agent_toolkit_result.stdout | from_json).changed

- name: Report toolkit packages, migrations, and instruction overrides
  ansible.builtin.debug:
    msg: "{{ agent_toolkit_result.stdout | from_json }}"
