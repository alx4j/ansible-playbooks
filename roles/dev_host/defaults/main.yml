---
dev_host_user: "{{ sudo_user }}"
dev_host_home: "/home/{{ dev_host_user }}"
dev_host_projects_dir: "{{ lookup('ansible.builtin.env', 'PROJECTS_DIR') | default('projects', true) }}"
dev_host_authorized_keys: []
dev_host_password_hash: "{{ lookup('ansible.builtin.env', 'SUDO_PASSWORD_HASH') }}"
dev_host_passwordless_sudo: false
dev_host_ssh_port: 22
dev_host_ssh_permit_root_login: "no"
dev_host_ssh_password_authentication: "no"
dev_host_ssh_keyboard_interactive_authentication: "no"

dev_host_base_packages:
  - sudo
  - acl
  - unattended-upgrades
  - apt-listchanges
  - podman
  - uidmap
  - dbus-user-session
  - podman-compose
  - curl
  - ca-certificates
  - zip
  - unzip
  - mosh
  - ufw
  - tmux
  - git
  - build-essential
  - python3-venv
  - python3-packaging

dev_host_automatic_reboot: false
dev_host_java_version: "25.0.5.0+8-zulu"
dev_host_java_home: "{{ dev_host_home }}/.sdkman/candidates/java/{{ dev_host_java_version }}"
dev_host_jenv_java_alias: zulu-25
# jenv 0.6.0, pinned to its release commit.
