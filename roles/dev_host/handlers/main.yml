---
- name: Restart Moshi user service
  when: dev_host_moshi_manage_service
  become: true
  become_user: "{{ dev_host_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ dev_host_runtime_directory }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ dev_host_runtime_directory }}/bus"
  ansible.builtin.systemd_service:
    name: moshi-hook.service
    scope: user
    state: restarted

- name: Validate installed SSH configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false

- name: Reload SSH
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
