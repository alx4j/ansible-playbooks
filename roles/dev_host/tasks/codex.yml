---
- name: Check whether Codex is installed
  ansible.builtin.stat:
    path: "{{ dev_host_home }}/.local/bin/codex"
  register: dev_host_codex_binary

- name: Read the installed Codex version
  when: dev_host_codex_binary.stat.exists
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.local/bin/codex"
      - --version
  register: dev_host_codex_current
  changed_when: false
  check_mode: false

- name: Install the selected Codex release when it differs
  when: dev_host_codex_current.stdout | default('') != 'codex-cli ' ~ dev_host_codex_version
  block:
    - name: Download the reviewed Codex installer
      ansible.builtin.get_url:
        url: https://chatgpt.com/codex/install.sh
        dest: "{{ dev_host_home }}/.cache/ansible-installers/codex.sh"
        checksum: "{{ dev_host_codex_installer_checksum }}"
        mode: "0600"

    - name: Install the requested Codex version
      ansible.builtin.command:
        argv:
          - /bin/sh
          - "{{ dev_host_home }}/.cache/ansible-installers/codex.sh"
          - --release
          - "{{ dev_host_codex_version }}"
      environment:
        CODEX_NON_INTERACTIVE: "1"
        CODEX_INSTALL_DIR: "{{ dev_host_home }}/.local/bin"
      changed_when: true

- name: Verify Codex after installation
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.local/bin/codex"
      - --version
  register: dev_host_codex_result
  changed_when: false

- name: Require the requested Codex version
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - dev_host_codex_result.stdout == 'codex-cli ' ~ dev_host_codex_version

- name: Seed explicitly supplied Codex configuration without overwriting application changes
  when: dev_host_codex_config_source | length > 0
  ansible.builtin.copy:
    src: "{{ dev_host_codex_config_source }}"
    dest: "{{ dev_host_home }}/.codex/config.toml"
    mode: "0600"
    force: false
  no_log: true
  diff: false

- name: Install explicitly supplied Codex instructions
  when: dev_host_codex_instructions_source | length > 0
  ansible.builtin.copy:
    src: "{{ dev_host_codex_instructions_source }}"
    dest: "{{ dev_host_home }}/.codex/AGENTS.md"
    mode: "0600"
  no_log: true
  diff: false
