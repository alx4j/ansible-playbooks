---
- name: Create the projects directory
  ansible.builtin.import_tasks: projects.yml

- name: Create user tool and configuration directories
  ansible.builtin.file:
    path: "{{ dev_host_home }}/{{ dev_host_directory }}"
    state: directory
    mode: "0700"
  loop:
    - .local/bin
    - .cache/ansible-installers
    - .local/share/moshi
    - .config/dev-environment
    - .codex
  loop_control:
    loop_var: dev_host_directory

- name: Install and configure SDKMAN
  ansible.builtin.import_tasks: sdkman.yml

- name: Install Java through SDKMAN
  ansible.builtin.import_tasks: java.yml

- name: Select Java through jenv
  ansible.builtin.import_tasks: jenv.yml

- name: Install and select Gradle
  ansible.builtin.import_tasks: gradle.yml

- name: Install and select Go
  ansible.builtin.import_tasks: go.yml

- name: Install and select Rust and Cargo
  ansible.builtin.import_tasks: rust.yml

- name: Install Codex
  ansible.builtin.import_tasks: codex.yml

- name: Install Moshi
  ansible.builtin.import_tasks: moshi.yml

- name: Manage the shared development shell environment
  become: true
  become_user: root
  ansible.builtin.template:
    src: environment.sh.j2
    dest: "{{ dev_host_home }}/.config/dev-environment/environment.sh"
    owner: "{{ dev_host_user }}"
    group: "{{ dev_host_user }}"
    mode: "0644"
    validate: /bin/bash -n %s

- name: Load the managed environment in login and interactive Bash shells
  ansible.builtin.blockinfile:
    path: "{{ dev_host_home }}/{{ dev_host_shell_file }}"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE DEVELOPMENT ENVIRONMENT"
    block: |
      if [ -r "$HOME/.config/dev-environment/environment.sh" ]; then
        . "$HOME/.config/dev-environment/environment.sh"
      fi
  loop:
    - .profile
    - .bashrc
  loop_control:
    loop_var: dev_host_shell_file
