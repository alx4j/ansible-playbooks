---
- name: Lock pending bootstrap passwords after verifying development key login and sudo
  ansible.builtin.script:
    cmd: bootstrap_password.py finish {{ dev_host_user | quote }}
    removes: /var/lib/dev-vps-bootstrap-password-locks
  register: dev_host_locked_password
  changed_when: dev_host_locked_password.stdout | default('') | trim == 'changed'
