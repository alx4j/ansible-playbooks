---
- name: Identify the account on the original SSH connection
  vars:
    ansible_become: false
  ansible.builtin.command:
    argv: [id, -un]
  register: dev_host_initial_login
  changed_when: false
  check_mode: false

- name: Require the intended initial administrator on the original connection
  ansible.builtin.assert:
    that:
      - dev_host_initial_login.stdout == dev_host_bootstrap_user | default('root')
      - dev_host_initial_login.stdout != dev_host_user
    fail_msg: Password handoff requires a verified initial login distinct from the development account.

- name: Record the initial account for password locking before creating replacement access
  ansible.builtin.script: >-
    bootstrap_password.py record {{ dev_host_initial_login.stdout | quote }} {{ dev_host_user | quote }}
  register: dev_host_recorded_password
  changed_when: dev_host_recorded_password.stdout | default('') | trim == 'changed'
