---
- name: Check the Moshi binary
  ansible.builtin.stat:
    path: "{{ dev_host_home }}/.local/bin/moshi-hook"
  register: dev_host_moshi_binary

- name: Read the installed Moshi version
  when: dev_host_moshi_binary.stat.exists
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.local/bin/moshi-hook"
      - --version
  register: dev_host_moshi_current
  changed_when: false
  check_mode: false

- name: Install the selected Moshi release
  when: dev_host_moshi_current.stdout | default('') != 'moshi-hook version ' ~ dev_host_moshi_version
  vars:
    dev_host_moshi_asset: "moshi-hook_Linux_{{ dev_host_moshi_architectures[ansible_facts['architecture']] }}.tar.gz"
    dev_host_moshi_release_url: "https://cdn.getmoshi.app/hook/v{{ dev_host_moshi_version }}"
  block:
    - name: Download the checksum-verified Moshi archive
      ansible.builtin.get_url:
        url: "{{ dev_host_moshi_release_url }}/{{ dev_host_moshi_asset }}"
        dest: "{{ dev_host_home }}/.cache/ansible-installers/moshi-{{ dev_host_moshi_version }}.tar.gz"
        checksum: "sha256:{{ dev_host_moshi_release_url }}/checksums.txt"
        mode: "0600"

    - name: Create a versioned Moshi extraction directory
      ansible.builtin.file:
        path: "{{ dev_host_home }}/.local/share/moshi/{{ dev_host_moshi_version }}"
        state: directory
        mode: "0700"

    - name: Extract the verified Moshi release
      ansible.builtin.unarchive:
        src: "{{ dev_host_home }}/.cache/ansible-installers/moshi-{{ dev_host_moshi_version }}.tar.gz"
        dest: "{{ dev_host_home }}/.local/share/moshi/{{ dev_host_moshi_version }}"
        remote_src: true

    - name: Install the Moshi binary
      ansible.builtin.copy:
        src: "{{ dev_host_home }}/.local/share/moshi/{{ dev_host_moshi_version }}/moshi-hook"
        dest: "{{ dev_host_home }}/.local/bin/moshi-hook"
        remote_src: true
        mode: "0755"
      notify: Restart Moshi user service

- name: Maintain the Moshi command alias
  ansible.builtin.file:
    src: moshi-hook
    dest: "{{ dev_host_home }}/.local/bin/moshi"
    state: link

- name: Verify the installed Moshi version
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.local/bin/moshi-hook"
      - --version
  register: dev_host_moshi_result
  changed_when: false

- name: Require the requested Moshi version
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - dev_host_moshi_result.stdout == 'moshi-hook version ' ~ dev_host_moshi_version

- name: Inspect installed agent hooks without exposing account diagnostics
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.local/bin/moshi-hook"
      - doctor
      - --json
  register: dev_host_moshi_doctor
  changed_when: false
  failed_when: dev_host_moshi_doctor.rc not in [0, 1]
  no_log: true

- name: Install missing or outdated agent hooks
  when:
    - not ansible_check_mode
    - >-
      (dev_host_moshi_doctor.stdout | from_json).checks
      | selectattr('group', 'equalto', 'Agents')
      | selectattr('subject', 'equalto', dev_host_hook_target)
      | selectattr('detail', 'equalto', 'hooks current')
      | list | length == 0
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.local/bin/moshi-hook"
      - install
      - --target
      - "{{ dev_host_hook_target }}"
  loop: "{{ dev_host_moshi_hook_targets }}"
  loop_control:
    loop_var: dev_host_hook_target
  changed_when: true
  no_log: true
