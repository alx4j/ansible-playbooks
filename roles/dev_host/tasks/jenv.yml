---
- name: Validate the managed jenv alias and revision
  ansible.builtin.assert:
    that:
      - dev_host_jenv_java_alias is match('^[A-Za-z0-9][A-Za-z0-9._+-]*$')
      - dev_host_jenv_java_alias != 'system'
      - dev_host_jenv_revision is match('^[0-9a-f]{40}$')
    fail_msg: Use a named Java alias and a pinned jenv commit.

- name: Install the pinned jenv release
  ansible.builtin.git:
    repo: https://github.com/jenv/jenv.git
    dest: "{{ dev_host_home }}/.jenv"
    version: "{{ dev_host_jenv_revision }}"
    recursive: false
  register: dev_host_jenv_checkout

- name: Create jenv registration and plugin directories
  ansible.builtin.file:
    path: "{{ dev_host_home }}/.jenv/{{ dev_host_jenv_directory }}"
    state: directory
    mode: "0700"
  loop:
    - versions
    - plugins
  loop_control:
    loop_var: dev_host_jenv_directory

- name: Register the selected JDK under its jenv alias
  ansible.builtin.file:
    src: "{{ dev_host_java_home }}"
    dest: "{{ dev_host_home }}/.jenv/versions/{{ dev_host_jenv_java_alias }}"
    state: link
  register: dev_host_jenv_registration

- name: Enable jenv management of JAVA_HOME
  ansible.builtin.file:
    src: "{{ dev_host_home }}/.jenv/available-plugins/export"
    dest: "{{ dev_host_home }}/.jenv/plugins/export"
    state: link

- name: Select the default Java alias for the development account
  ansible.builtin.copy:
    dest: "{{ dev_host_home }}/.jenv/version"
    content: "{{ dev_host_jenv_java_alias }}\n"
    mode: "0600"

- name: Check whether the Java command shim exists
  ansible.builtin.stat:
    path: "{{ dev_host_home }}/.jenv/shims/java"
  register: dev_host_jenv_java_shim

- name: Refresh jenv command shims after installation or registration changes
  when: dev_host_jenv_checkout.changed or dev_host_jenv_registration.changed or not dev_host_jenv_java_shim.stat.exists
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.jenv/bin/jenv"
      - rehash
  changed_when: true

- name: Verify Java through the configured jenv alias
  ansible.builtin.command:
    argv:
      - "{{ dev_host_home }}/.jenv/shims/java"
      - -version
  environment:
    JENV_VERSION: "{{ dev_host_jenv_java_alias }}"
  changed_when: false
