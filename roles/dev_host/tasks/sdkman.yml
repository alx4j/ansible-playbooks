---
- name: Check whether SDKMAN is installed
  ansible.builtin.stat:
    path: "{{ dev_host_home }}/.sdkman/bin/sdkman-init.sh"
  register: dev_host_sdkman_init

- name: Download the reviewed noninteractive SDKMAN installer
  when: not dev_host_sdkman_init.stat.exists
  ansible.builtin.get_url:
    url: https://get.sdkman.io?ci=true&rcupdate=false
    dest: "{{ dev_host_home }}/.cache/ansible-installers/sdkman.sh"
    checksum: "{{ dev_host_sdkman_installer_checksum }}"
    mode: "0600"

- name: Install SDKMAN without editing shell startup files
  when: not dev_host_sdkman_init.stat.exists
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ dev_host_home }}/.cache/ansible-installers/sdkman.sh"
    creates: "{{ dev_host_home }}/.sdkman/bin/sdkman-init.sh"

- name: Configure noninteractive SDKMAN with TLS and checksum validation
  ansible.builtin.lineinfile:
    path: "{{ dev_host_home }}/.sdkman/etc/config"
    regexp: "^{{ dev_host_sdkman_setting.key }}="
    line: "{{ dev_host_sdkman_setting.key }}={{ dev_host_sdkman_setting.value }}"
    mode: "0600"
  loop:
    - {key: sdkman_auto_answer, value: "true"}
    # jenv owns Java selection when entering project directories.
    - {key: sdkman_auto_env, value: "false"}
    - {key: sdkman_selfupdate_feature, value: "false"}
    - {key: sdkman_checksum_enable, value: "true"}
    - {key: sdkman_insecure_ssl, value: "false"}
    - {key: sdkman_healthcheck_enable, value: "false"}
  loop_control:
    loop_var: dev_host_sdkman_setting

- name: Verify SDKMAN initializes successfully
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      source "$SDKMAN_DIR/bin/sdkman-init.sh"
      sdk version
    executable: /bin/bash
  changed_when: false
