---
- name: Open a fresh SSH connection
  ansible.builtin.meta: reset_connection

- name: Preserve the host's SSH transport options for the access check
  ansible.builtin.set_fact:
    dev_host_access_ssh_args: "{{ lookup('ansible.builtin.config', 'ssh_args', plugin_type='connection', plugin_name='ssh') }}"
  no_log: true

- name: Check account and sudo with the authentication policy the host will require
  vars:
    ansible_connection: ssh
    # OpenSSH takes the first option. Keep proxy, identity and host-key settings
    # while preventing a password or an existing master socket from satisfying this check.
    ansible_ssh_args: >-
      {{ '-o PreferredAuthentications=publickey -o PubkeyAuthentication=yes -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no -o ControlPath=none -o ControlMaster=no -o ControlPersist=no'
         if dev_host_ssh_password_authentication == 'no' else '' }}
      {{ dev_host_access_ssh_args }}
  block:
    - name: Verify the connected account
      become: false
      ansible.builtin.command:
        argv:
          - id
          - -un
      register: dev_host_connected_account
      changed_when: false
      check_mode: false

    - name: Require development access before configuring SSH restrictions
      ansible.builtin.assert:
        that:
          - dev_host_connected_account.stdout == dev_host_user
        fail_msg: Run bootstrap.yml first, then connect as the development user for site.yml.

    - name: Verify privilege escalation on the fresh connection
      become: true
      ansible.builtin.command:
        argv:
          - id
          - -u
      register: dev_host_privileged_account
      changed_when: false
      check_mode: false

    - name: Require administrative access
      ansible.builtin.assert:
        that:
          - dev_host_privileged_account.stdout == '0'
