---
- name: Validate bootstrap inputs
  ansible.builtin.import_tasks: preflight.yml

- name: Install administrative tools
  ansible.builtin.apt:
    name:
      - sudo
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Establish the development account
  ansible.builtin.import_tasks: account.yml

- name: Report the established development account
  ansible.builtin.debug:
    msg: The development account is ready. SSH policy is unchanged.
