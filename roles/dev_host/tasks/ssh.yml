---
- name: Create the local validation helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the complete-configuration SSH validator
  ansible.builtin.copy:
    src: validate_ssh.py
    dest: /usr/local/libexec/validate-ssh-dropin
    owner: root
    group: root
    mode: "0755"

- name: Install validated SSH policy
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: >-
      /usr/local/libexec/validate-ssh-dropin %s
      /etc/ssh/sshd_config.d/00-hardening.conf
      {{ dev_host_ssh_permit_root_login }}
      {{ dev_host_ssh_password_authentication }}
      {{ dev_host_ssh_keyboard_interactive_authentication }}
  notify:
    - Validate installed SSH configuration
    - Reload SSH

- name: Apply pending service changes before checking access
  ansible.builtin.meta: flush_handlers

- name: Verify a fresh connection after SSH changes
  ansible.builtin.import_tasks: access.yml
