---
- name: Require a controller token when provisioning Doppler
  when: doppler_secrets_enabled | bool
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'DOPPLER_TOKEN') | length > 0
    fail_msg: Supply DOPPLER_TOKEN to provision Doppler, or disable doppler_secrets_enabled to reuse an existing service.

- name: Verify existing Doppler access for the enabled GitHub integrations
  when:
    - not (doppler_secrets_enabled | bool)
    - (agent_toolkit_enabled | default(false) | bool) or (work_repositories_enabled | default(false) | bool)
  block:
    - name: Ping the broker as its development account
      become: true
      become_user: "{{ doppler_secrets_client_user }}"
      ansible.builtin.script:
        cmd: skill/scripts/doppler.py doctor --offline
        executable: /usr/bin/python3
      changed_when: false
      check_mode: false
  rescue:
    - name: Explain how to enable the GitHub integrations
      ansible.builtin.fail:
        msg: >-
          The GitHub integrations need a working Doppler service. Supply DOPPLER_TOKEN
          and enable Doppler provisioning, restore service access for {{ doppler_secrets_client_user }},
          or set both agent_toolkit_enabled and work_repositories_enabled to false.
