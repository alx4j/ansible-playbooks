---
- name: Require encrypted credentials and SSH pipelining
  ansible.builtin.assert:
    that:
      - ansible_facts['service_mgr'] == 'systemd'
      - doppler_secrets_client_user is match('^[a-z_][a-z0-9_-]*$')
      - doppler_secrets_client_user not in ['root', 'doppler-secrets']
      - not (lookup('ansible.builtin.config', 'DEFAULT_KEEP_REMOTE_FILES') | bool)
    fail_msg: Use systemd, a non-root development account, and disable Ansible remote-file retention.

- name: Verify systemd credential support
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-creds
      - --version
  changed_when: false

- name: Create the isolated secret-service group
  ansible.builtin.group:
    name: doppler-secrets
    system: true

- name: Create the isolated secret-service account
  ansible.builtin.user:
    name: doppler-secrets
    group: doppler-secrets
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
    password_lock: true

- name: Create root-owned runtime code and encrypted credential directories
  ansible.builtin.file:
    path: "{{ doppler_secrets_directory.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ doppler_secrets_directory.mode }}"
  loop:
    - path: /usr/local/lib/doppler-secrets
      mode: "0755"
    - path: /etc/credstore.encrypted/doppler-secrets
      mode: "0700"
  loop_control:
    loop_var: doppler_secrets_directory

- name: Install the secret service
  ansible.builtin.copy:
    src: broker.py
    dest: /usr/local/lib/doppler-secrets/broker.py
    owner: root
    group: root
    mode: "0644"
  register: doppler_secrets_broker

- name: Install the encrypted credential writer
  ansible.builtin.copy:
    src: store-credential.py
    dest: /usr/local/lib/doppler-secrets/store-credential.py
    owner: root
    group: root
    mode: "0644"

- name: Store the Doppler token without a plaintext file
  vars:
    ansible_ssh_pipelining: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - /usr/local/lib/doppler-secrets/store-credential.py
    stdin: "{{ lookup('ansible.builtin.env', 'DOPPLER_TOKEN') }}"
    stdin_add_newline: false
  register: doppler_secrets_credential
  changed_when: doppler_secrets_credential.stdout == 'changed'
  no_log: true
  diff: false

- name: Install the local secret socket definition
  ansible.builtin.template:
    src: doppler-secrets.socket.j2
    dest: /etc/systemd/system/doppler-secrets.socket
    owner: root
    group: root
    mode: "0644"
  register: doppler_secrets_socket_unit

- name: Install the isolated secret service definition
  ansible.builtin.template:
    src: doppler-secrets.service.j2
    dest: /etc/systemd/system/doppler-secrets.service
    owner: root
    group: root
    mode: "0644"
  register: doppler_secrets_service_unit

- name: Enable the local secret socket and apply changed units
  ansible.builtin.systemd_service:
    name: doppler-secrets.socket
    enabled: true
    state: "{{ 'restarted' if doppler_secrets_socket_unit.changed else 'started' }}"
    daemon_reload: "{{ doppler_secrets_socket_unit.changed or doppler_secrets_service_unit.changed }}"

- name: Apply secret service changes
  vars:
    doppler_secrets_restart_required: >-
      {{ doppler_secrets_broker.changed or doppler_secrets_service_unit.changed
         or doppler_secrets_socket_unit.changed or doppler_secrets_credential.stdout | default('') == 'changed' }}
  block:
    # systemd also counts planned maintenance toward the start limit.
    - name: Allow a fresh start after changing code or credentials
      when: doppler_secrets_restart_required
      ansible.builtin.command:
        argv:
          - systemctl
          - reset-failed
          - doppler-secrets.service
      changed_when: true

    - name: Start the secret service and apply changed code or credentials
      ansible.builtin.systemd_service:
        name: doppler-secrets.service
        enabled: true
        state: "{{ 'restarted' if doppler_secrets_restart_required else 'started' }}"

- name: Install the stable credential client
  ansible.builtin.import_tasks: client.yml

- name: Create the managed Doppler skill directory
  when: doppler_secrets_install_skill | bool
  ansible.builtin.file:
    path: "{{ doppler_secrets_client_home }}/{{ doppler_secrets_skill_directory }}"
    state: directory
    owner: "{{ doppler_secrets_client_user }}"
    group: "{{ doppler_secrets_client_user }}"
    mode: "0755"
  loop:
    - .codex/skills
    - .codex/skills/doppler-secrets
  loop_control:
    loop_var: doppler_secrets_skill_directory

- name: Install the Doppler skill and command wrapper
  when: doppler_secrets_install_skill | bool
  ansible.builtin.copy:
    src: skill/
    dest: "{{ doppler_secrets_client_home }}/.codex/skills/doppler-secrets/"
    owner: "{{ doppler_secrets_client_user }}"
    group: "{{ doppler_secrets_client_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Verify local secret service access as the development account
  when: not ansible_check_mode
  become: true
  become_user: "{{ doppler_secrets_client_user }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/lib/doppler-secrets/client.py
      - doctor
      - --offline
  register: doppler_secrets_health
  until: doppler_secrets_health.rc == 0
  retries: 5
  delay: 1
  changed_when: false
