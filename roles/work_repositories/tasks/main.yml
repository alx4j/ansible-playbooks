---
- name: Install repository synchronization prerequisites
  ansible.builtin.import_tasks: setup.yml

- name: Synchronize work repositories as the development account
  when: not ansible_check_mode
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - /usr/local/lib/work-repositories/process_activity.py
      - "{{ work_repositories_user }}"
      - "{{ work_repositories_directory }}"
      - /usr/bin/python3
      - /usr/local/lib/doppler-secrets/client.py
      - run
      - --map
      - "{{ work_repositories_github_secret }}=GITHUB_TOKEN"
      - --clean-env
      - --inherit
      - HOME
      - --
      - /usr/bin/python3
      - -I
      - /usr/local/lib/work-repositories/sync.py
      - --owner
      - "{{ work_repositories_owner }}"
      - --topic
      - "{{ work_repositories_topic }}"
      - --herdr-session
      - "{{ work_repositories_herdr_session }}"
  register: work_repositories_result
  changed_when: work_repositories_result.rc == 0 and (work_repositories_result.stdout | from_json).changed

- name: Report repository synchronization
  when: not ansible_check_mode
  ansible.builtin.debug:
    msg: "{{ work_repositories_result.stdout | from_json }}"
